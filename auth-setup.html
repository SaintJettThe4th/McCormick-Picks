<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>McCormick Picks - Account Setup</title>
<style>
body{font-family:system-ui,sans-serif;background:#0d1b2a;color:#e2e8f0;margin:0;padding:2rem}
main{max-width:430px;margin:5vh auto;background:#152b42;border-radius:16px;padding:2rem}
label{display:block;margin:1rem 0 .4rem}input,button{box-sizing:border-box;width:100%;padding:.8rem;border-radius:8px;font:inherit}
button{margin-top:1rem;background:#c7a34c;border:0;color:#101a25;font-weight:bold;cursor:pointer}
input{background:#fff;color:#111;border:0}a{color:#f3cd74}
#status{min-height:2.5rem}#setup{display:none}
</style>
</head>
<body><main>
<h1>McCormick Picks</h1>
<h2>Finish account setup</h2>
<p id="status" role="status">Checking your invitation…</p>
<form id="setup">
<label for="password">Choose a new password (at least 12 characters)</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" required>
<label for="confirm">Confirm password</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
<button type="submit">Save password</button>
</form>
<div id="recovery" style="margin-top:1rem">
<p>If your invitation failed, request a new password setup email:</p>
<label for="email">Account email</label>
<input id="email" type="email" autocomplete="email" placeholder="Email address">
<button type="button" id="send-recovery">Send password setup email</button>
</div>
<p><a href="./">Return to McCormick Picks</a></p>
<p><small>The main app will use Supabase login after the secure pick migration is complete.</small></p>
</main>
<script>window.MCCORMICK_SUPABASE_CONFIG={url:'https://bquxrvtsuqcmlnuejxxn.supabase.co',publishableKey:'sb_publishable_BB1y7vflwxgBUOXFV-0mrw_PaDKn24G'}</script>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const status=document.getElementById('status');
const form=document.getElementById('setup');
const cfg=window.MCCORMICK_SUPABASE_CONFIG;
if(!cfg || !/^sb_publishable_[A-Za-z0-9_-]+$/.test(cfg.publishableKey)){
 status.textContent='Supabase configuration is unavailable.';
}else{

 const client=createClient(cfg.url,cfg.publishableKey,{auth:{detectSessionInUrl:true,flowType:'implicit'}});
 const recovery=document.getElementById('recovery');
 const query=new URLSearchParams(location.search);
 const hash=new URLSearchParams(location.hash.slice(1));
 const errorCode=query.get('error_code')||hash.get('error_code');
 const errorDescription=query.get('error_description')||hash.get('error_description');
 const hadInvite=Boolean(query.get('code')||query.get('token_hash')||hash.get('access_token')||errorCode);
 function showError(e){
   const msg=(e?.message||'').toLowerCase();
   if(errorCode==='otp_expired'||msg.includes('expired')) status.textContent='This invitation has expired or was already used. Request a password setup email below.';
   else status.textContent='Could not verify this invitation. Request a password setup email below.';
 }
 document.getElementById('send-recovery').addEventListener('click',async()=>{
   const email=document.getElementById('email').value.trim();
   if(!email){status.textContent='Enter your account email.';return;}
   const button=document.getElementById('send-recovery');
   button.disabled=true;
   try{
     const {error}=await client.auth.resetPasswordForEmail(email,{
       redirectTo:'https://saintjettthe4th.github.io/McCormick-Picks/auth-setup.html'
     });
     if(error) throw error;
     status.textContent='If this email belongs to an existing account, a password setup link will arrive shortly. Check spam too.';
   }catch(e){status.textContent='Could not send the email. Check Supabase email settings or try again later.';}
   finally{button.disabled=false;}
 });
 try{
   // Supabase JS processes implicit recovery/invite hash tokens during initialization.
   const {data,error:sessionError}=await client.auth.getSession();
   if(sessionError) throw sessionError;
   if(errorDescription) throw new Error(errorDescription);
   if(!data.session){
     status.textContent=hadInvite?'Invitation could not be verified. Request a password setup email below.':'Open this page using an invitation or request a password setup email below.';
   }else{
     history.replaceState({},'',location.pathname);
     status.textContent='Account verified. Set your password.';
     recovery.style.display='none';
     form.style.display='block';
     form.addEventListener('submit',async e=>{
       e.preventDefault();
       const password=document.getElementById('password').value;
       const confirm=document.getElementById('confirm').value;
       if(password!==confirm){status.textContent='Passwords do not match.';return;}
       const button=form.querySelector('button');
       button.disabled=true;
       const {error}=await client.auth.updateUser({password});
       if(error){status.textContent=error.message;button.disabled=false;return;}
       await client.auth.signOut();
       form.style.display='none';
       status.textContent='Password saved. Your account is ready for the new app login after migration.';
     });
   }
 }catch(e){
   history.replaceState({},'',location.pathname);
   showError(e);
 }
}
</script>
</body></html>
